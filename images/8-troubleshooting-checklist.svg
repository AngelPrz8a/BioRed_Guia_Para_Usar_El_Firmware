<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title description">
  <title id="title">Lista de verificación para diagnosticar BioRed</title>
  <desc id="description">Ocho pasos de diagnóstico ordenados: cable y puerto, WiFi, librerías, carpeta, configuración, portal, destino de datos y Monitor Serie.</desc>
  <rect width="900" height="460" rx="24" fill="#eef5f8"/>
  <text x="450" y="58" text-anchor="middle" fill="#183752" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Diagnóstico en orden</text>
  <text x="450" y="86" text-anchor="middle" fill="#486679" font-family="Arial, Helvetica, sans-serif" font-size="16">De las comprobaciones básicas a la comunicación remota</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="122" width="360" height="62" rx="12" fill="#fff" stroke="#cfdee5" stroke-width="2"/>
    <circle cx="105" cy="153" r="20" fill="#3a9a60"/><text x="105" y="159" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">1</text>
    <text x="140" y="159" fill="#183752" font-size="17" font-weight="700">Cable y puerto USB</text>
    <rect x="470" y="122" width="360" height="62" rx="12" fill="#fff" stroke="#cfdee5" stroke-width="2"/>
    <circle cx="505" cy="153" r="20" fill="#3a9a60"/><text x="505" y="159" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">2</text>
    <text x="540" y="159" fill="#183752" font-size="17" font-weight="700">Red WiFi de 2,4 GHz</text>
    <rect x="70" y="198" width="360" height="62" rx="12" fill="#fff" stroke="#cfdee5" stroke-width="2"/>
    <circle cx="105" cy="229" r="20" fill="#5d9bb8"/><text x="105" y="235" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">3</text>
    <text x="140" y="235" fill="#183752" font-size="17" font-weight="700">Librerías instaladas</text>
    <rect x="470" y="198" width="360" height="62" rx="12" fill="#fff" stroke="#cfdee5" stroke-width="2"/>
    <circle cx="505" cy="229" r="20" fill="#5d9bb8"/><text x="505" y="235" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">4</text>
    <text x="540" y="235" fill="#183752" font-size="17" font-weight="700">Nombre de la carpeta</text>
    <rect x="70" y="274" width="360" height="62" rx="12" fill="#fff" stroke="#cfdee5" stroke-width="2"/>
    <circle cx="105" cy="305" r="20" fill="#5d9bb8"/><text x="105" y="311" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">5</text>
    <text x="140" y="311" fill="#183752" font-size="17" font-weight="700">Configuración de compilación</text>
    <rect x="470" y="274" width="360" height="62" rx="12" fill="#fff" stroke="#cfdee5" stroke-width="2"/>
    <circle cx="505" cy="305" r="20" fill="#5d9bb8"/><text x="505" y="311" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">6</text>
    <text x="540" y="311" fill="#183752" font-size="17" font-weight="700">Portal: sensor y salida</text>
    <rect x="70" y="350" width="360" height="62" rx="12" fill="#fff" stroke="#cfdee5" stroke-width="2"/>
    <circle cx="105" cy="381" r="20" fill="#d08b38"/><text x="105" y="387" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">7</text>
    <text x="140" y="387" fill="#183752" font-size="17" font-weight="700">Broker o servidor activo</text>
    <rect x="470" y="350" width="360" height="62" rx="12" fill="#fff" stroke="#cfdee5" stroke-width="2"/>
    <circle cx="505" cy="381" r="20" fill="#d08b38"/><text x="505" y="387" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">8</text>
    <text x="540" y="387" fill="#183752" font-size="17" font-weight="700">Monitor Serie a 115200</text>
  </g>
</svg>
