<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title description">
  <title id="title">Editor para revisar el proyecto</title>
  <desc id="description">Ventana ilustrativa de un editor de código con carpetas del proyecto y un archivo de configuración.</desc>
  <rect width="900" height="460" rx="24" fill="#eef5f8"/>
  <rect x="100" y="58" width="700" height="344" rx="16" fill="#fff" stroke="#cfdee5" stroke-width="3"/>
  <path d="M116 58h668a16 16 0 0 1 16 16v40H100V74a16 16 0 0 1 16-16Z" fill="#183752"/>
  <circle cx="132" cy="84" r="7" fill="#f17474"/>
  <circle cx="156" cy="84" r="7" fill="#f2c56b"/>
  <circle cx="180" cy="84" r="7" fill="#6ccc91"/>
  <text x="216" y="91" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Editor de proyecto</text>
  <rect x="120" y="130" width="212" height="250" rx="8" fill="#f2f7f9"/>
  <text x="142" y="168" fill="#334b5b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">BIORED</text>
  <text x="158" y="207" fill="#617784" font-family="Arial, Helvetica, sans-serif" font-size="15">▸ src</text>
  <text x="178" y="244" fill="#267b99" font-family="Arial, Helvetica, sans-serif" font-size="15">BioRedConfig.h</text>
  <text x="158" y="281" fill="#617784" font-family="Arial, Helvetica, sans-serif" font-size="15">▸ docs</text>
  <text x="158" y="318" fill="#617784" font-family="Arial, Helvetica, sans-serif" font-size="15">README.md</text>
  <rect x="350" y="130" width="430" height="250" rx="8" fill="#fbfcfd" stroke="#e2ebef"/>
  <text x="376" y="177" fill="#7857a6" font-family="Consolas, monospace" font-size="18"># Configuración local</text>
  <text x="376" y="219" fill="#276f82" font-family="Consolas, monospace" font-size="18"># Activar módulos requeridos</text>
  <text x="376" y="261" fill="#526879" font-family="Consolas, monospace" font-size="18">BIORED_SENSOR_DHT = 1</text>
  <text x="376" y="325" fill="#607887" font-family="Arial, Helvetica, sans-serif" font-size="16">Un editor permite revisar archivos y carpetas.</text>
</svg>
