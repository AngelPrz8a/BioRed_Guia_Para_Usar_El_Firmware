  <rect width="900" height="460" rx="24" fill="#eef5f8"/>
  <rect x="110" y="52" width="680" height="356" rx="16" fill="#fff" stroke="#cfdee5" stroke-width="3"/>
  <path d="M126 52h648a16 16 0 0 1 16 16v42H110V68a16 16 0 0 1 16-16Z" fill="#183752"/>
  <text x="146" y="91" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Administrador de bibliotecas</text>
  <rect x="145" y="132" width="610" height="224" rx="13" fill="#f8fbfc" stroke="#d6e3e8" stroke-width="2"/>
  <text x="178" y="184" fill="#293e53" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">ArduinoJson</text>
  <text x="178" y="218" fill="#647587" font-family="Arial, Helvetica, sans-serif" font-size="17">Benoît Blanchon</text>
  <text x="178" y="275" fill="#536c7c" font-family="Arial, Helvetica, sans-serif" font-size="16">Versión</text>
  <rect x="253" y="247" width="202" height="48" rx="8" fill="#e7f4ea" stroke="#7abc8d" stroke-width="2"/>
  <text x="274" y="278" fill="#286d43" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">6.x</text>
  <path d="m419 264 9 10 9-10" fill="none" stroke="#456f56" stroke-width="2"/>
  <text x="490" y="278" fill="#a14a43" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">No seleccionar 7.x</text>
  <text x="178" y="327" fill="#657b89" font-family="Arial, Helvetica, sans-serif" font-size="15">La serie 6 es la compatible con este proyecto.</text>
