<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title description">
  <title id="title">Error por librería faltante</title>
  <desc id="description">Ejemplo de un error del compilador que identifica DHT.h como archivo faltante.</desc>
  <rect width="900" height="460" rx="24" fill="#eef5f8"/>
  <rect x="110" y="62" width="680" height="336" rx="16" fill="#172b3b"/>
  <path d="M126 62h648a16 16 0 0 1 16 16v44H110V78a16 16 0 0 1 16-16Z" fill="#29485d"/>
  <circle cx="142" cy="96" r="7" fill="#f17474"/>
  <circle cx="166" cy="96" r="7" fill="#f2c56b"/>
  <circle cx="190" cy="96" r="7" fill="#6ccc91"/>
  <text x="226" y="103" fill="#e8f0f3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Salida de compilación</text>
  <text x="152" y="180" fill="#f0b3a9" font-family="Consolas, monospace" font-size="20">fatal error: DHT.h:</text>
  <text x="152" y="214" fill="#f0b3a9" font-family="Consolas, monospace" font-size="20">No such file or directory</text>
  <path d="M152 238h303" stroke="#db796d" stroke-width="3"/>
  <text x="152" y="285" fill="#d7e3e8" font-family="Arial, Helvetica, sans-serif" font-size="17">El archivo indicado ayuda a identificar</text>
  <text x="152" y="315" fill="#d7e3e8" font-family="Arial, Helvetica, sans-serif" font-size="17">la librería que falta.</text>
</svg>
